name: Deploy

on:
  push:
    branches: [master]
    paths: ["my-catan/**"]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  # ── Deploy server to Fly.io ─────────────────────────────────────────────────
  deploy-server:
    name: Deploy server (Fly.io)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config my-catan/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Deploy client to Cloudflare Pages ──────────────────────────────────────
  deploy-client:
    name: Deploy client (Cloudflare Pages)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-catan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-catan/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w @catan/shared

      - name: Build client
        run: npm run build -w @catan/client
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/client/dist --project-name=catan-client --branch=main
