<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catan Resource Tracker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Resource Tracker</h1>
    <button id="reset-btn" title="Reset all counts">Reset</button>
  </header>

  <div id="no-data">
    No game data yet.<br />Start a game on colonist.io.
  </div>

  <div id="tracker-table" hidden>
    <table>
      <thead>
        <tr>
          <th class="player-col">Player</th>
          <th title="Wood">&#x1F332;</th>
          <th title="Brick">&#x1F9F1;</th>
          <th title="Wheat">&#x1F33E;</th>
          <th title="Ore">&#x26F0;&#xFE0F;</th>
          <th title="Sheep">&#x1F411;</th>
          <th class="total-col">Total</th>
        </tr>
      </thead>
      <tbody id="player-rows"></tbody>
    </table>
  </div>

  <script src="popup.js"></script>
</body>
</html>
